<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataSphere — Configuration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .header .subtitle {
      font-size: 11px;
      color: #64748b;
    }
    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus {
      border-color: #10b981;
    }
    .field .hint {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 3px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #10b981;
      color: white;
    }
    .btn-primary:hover { background: #059669; }
    .btn-secondary {
      background: #e2e8f0;
      color: #475569;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #cbd5e1; }
    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
      display: block;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
    }
    .footer a {
      color: #10b981;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">DS</div>
    <div>
      <h1>DataSphere</h1>
      <div class="subtitle">LinkedIn Comment Capture</div>
    </div>
  </div>

  <div class="field">
    <label for="apiUrl">URL du serveur DataSphere</label>
    <input type="url" id="apiUrl" placeholder="https://datasphere-sq19.onrender.com">
    <div class="hint">L'URL de votre instance DataSphere</div>
  </div>

  <div class="field">
    <label for="apiKey">Clé API (dsk_live_...)</label>
    <input type="password" id="apiKey" placeholder="dsk_live_xxxxxxxxxxxx">
    <div class="hint">Créez une clé API dans Paramètres → API Keys (plan Business requis)</div>
  </div>

  <button class="btn btn-primary" id="save">Enregistrer</button>
  <button class="btn btn-secondary" id="test">Tester la connexion</button>

  <div class="status" id="status"></div>

  <div class="footer">
    Vos commentaires LinkedIn seront capturés automatiquement et envoyés vers DataSphere pour auto-réponse IA.
    <br>
    <a href="https://datasphere-sq19.onrender.com/settings" target="_blank">Ouvrir DataSphere →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
