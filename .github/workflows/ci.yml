name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Job 1 : Qualité code (lint + typecheck)
  # ============================================================
  quality:
    name: Lint + TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"

      - name: TypeScript check
        run: npx tsc --noEmit
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"

      - name: ESLint
        run: npx eslint . || true  # warnings non-bloquants en CI

  # ============================================================
  # Job 2 : Build (vérifie que le build passe)
  # ============================================================
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"

      - name: Build
        run: npx next build --webpack
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          DATASPHERE_AUTH_SECRET: ci-secret-for-build-only-32chars
          NEXT_PUBLIC_APP_URL: http://localhost:10000

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 3

  # ============================================================
  # Job 3 : Tests E2E (Playwright) avec PostgreSQL service
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    # Skip sur les PRs venant de forks
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datasphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/datasphere_test?schema=public"

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/datasphere_test?schema=public"

      - name: Build
        run: npx next build --webpack
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/datasphere_test?schema=public"
          DATASPHERE_AUTH_SECRET: ci-secret-for-build-only-32chars
          NEXT_PUBLIC_APP_URL: http://localhost:10000

      - name: Copy standalone assets
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          cp -r prisma .next/standalone/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/datasphere_test?schema=public"
          DATASPHERE_AUTH_SECRET: ci-secret-for-build-only-32chars
          NEXT_PUBLIC_APP_URL: http://localhost:10000
          PLAYWRIGHT_BASE_URL: http://localhost:10000
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
