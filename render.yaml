# DataSphere - Configuration Render
# https://render.com/docs/blueprint-spec
# Déploiement: docker + PostgreSQL + persistent disk pour uploads

services:
  - type: web
    name: datasphere
    runtime: docker
    plan: starter  # 512MB / 0.1 CPU - suffisant pour démarrer
    region: frankfurt  # Europe - plus proche de vos utilisateurs
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: datasphere-db
          property: connectionString
      - key: DATASPHERE_AUTH_SECRET
        generateValue: true  # Render génère un secret aléatoire
      - key: DEMO_MODE
        value: 'true'  # passer à 'false' une fois OAuth LinkedIn branché
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
    disk:
      name: datasphere-uploads
      mountPath: /app/data
      sizeGB: 1

# Base de données PostgreSQL managée par Render
databases:
  - name: datasphere-db
    plan: free  # 1GB, 90 jours gratuits - suffisant pour démarrer
    region: frankfurt
    ipAllowList: []  # accessible seulement par les services Render
