# ============================================================
# DataSphere - Configuration Render Blueprint (FREE PLAN)
# https://render.com/docs/blueprint-spec
#
# ⚠️ Plan Free Render :
#   - Pas de cron jobs (utilisez cron-job.org, voir docs/DEPLOYMENT.md)
#   - 750h/mois de runtime
#   - Spin down après 15 min d'inactivité (cold start ~30s)
#   - PostgreSQL free expire après 90 jours
#   - Pas de SSH (debug via logs + /api/health uniquement)
#
# Services créés :
#   - 1 web service (Docker, port 10000)
#   - 1 PostgreSQL (free tier, 1GB, expire après 90j)
# ============================================================

services:
  - type: web
    name: datasphere
    runtime: docker
    plan: free  # ⚠️ Free plan (pas de cron, spin down après 15min)
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"

      # PostgreSQL (auto-injecté depuis la DB ci-dessous)
      - key: DATABASE_URL
        fromDatabase:
          name: datasphere-db
          property: connectionString

      # Auth (auto-généré)
      - key: DATASPHERE_AUTH_SECRET
        generateValue: true

      # URL publique de l'app
      # ⚠️ Render ne permet pas de self-référence avec fromService.hosturl
      # Solution : Render expose automatiquement RENDER_EXTERNAL_URL
      # Le code utilise : NEXT_PUBLIC_APP_URL || RENDER_EXTERNAL_URL || fallback
      # Donc pas besoin de définir cette variable manuellement.
      # (Laissez vide, le code s'adapte automatiquement)
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # LinkedIn OAuth (à définir manuellement dans Render dashboard)
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false

      # Stripe (à définir manuellement)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BUSINESS_MONTHLY
        sync: false

      # Cron secret (pour protéger /api/cron/* endpoints appelés par cron-job.org)
      - key: CRON_SECRET
        generateValue: true

      # Email (Resend) - optionnel
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: "DataSphere <noreply@datasphere.app>"

      # Sentry - optionnel
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

      # Logs
      - key: LOG_LEVEL
        value: info

# ============================================================
# Base de données PostgreSQL managée
# ⚠️ Free tier : expire après 90 jours (voir docs/DEPLOYMENT.md)
# ============================================================
databases:
  - name: datasphere-db
    plan: free
    region: frankfurt
    ipAllowList: []

# ============================================================
# ❌ Pas de crons sur le plan free de Render
# Pour activer les tâches planifiées (sync analytics, scheduled publish,
# onboarding emails, payouts) :
#
# Option 1 : cron-job.org (gratuit, simple)
#   1. Créer un compte sur https://cron-job.org
#   2. Créer 4 jobs qui appellent :
#      - https://VOTRE-APP.onrender.com/api/cron/sync-analytics
#      - https://VOTRE-APP.onrender.com/api/cron/scheduled-publish
#      - https://VOTRE-APP.onrender.com/api/cron/onboarding-emails
#      - https://VOTRE-APP.onrender.com/api/cron/payouts
#   3. Headers : Authorization: Bearer ${CRON_SECRET}
#   4. Schedule : voir docs/DEPLOYMENT.md
#
# Option 2 : GitHub Actions (gratuit, intégré au repo)
#   Voir .github/workflows/cron.yml (à créer)
# ============================================================
