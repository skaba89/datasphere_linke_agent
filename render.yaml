# DataSphere - Configuration Render
# https://render.com/docs/blueprint-spec
# Déploiement: docker + PostgreSQL + Stripe + LinkedIn OAuth

services:
  - type: web
    name: datasphere
    runtime: docker
    plan: starter  # 512MB / 0.1 CPU - suffisant pour démarrer
    region: frankfurt  # Europe - plus proche de vos utilisateurs
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: datasphere-db
          property: connectionString
      - key: DATASPHERE_AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: datasphere
          property: hosturl
      # LinkedIn OAuth - à définir dans le dashboard Render
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false  # ex: https://datasphere.onrender.com/api/linkedin/callback
      # Stripe - à définir dans le dashboard Render
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BUSINESS_MONTHLY
        sync: false
      # Cron secret (pour protéger /api/cron/* endpoints)
      - key: CRON_SECRET
        generateValue: true
      # Email (Resend) - optionnel, fallback console si manquant
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: "DataSphere <noreply@datasphere.app>"

# Base de données PostgreSQL managée par Render
databases:
  - name: datasphere-db
    plan: free  # 1GB, 90 jours gratuits - suffisant pour démarrer
    region: frankfurt
    ipAllowList: []

# Cron job : sync analytics LinkedIn toutes les heures
# (récupère les likes/comments/shares réels des posts publiés)
crons:
  - name: sync-linkedin-analytics
    schedule: "0 * * * *"  # toutes les heures
    command: "curl -fsSL -H \"Authorization: Bearer $CRON_SECRET\" http://localhost:10000/api/cron/sync-analytics || true"
