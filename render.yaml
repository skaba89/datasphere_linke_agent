# ============================================================
# DataSphere - Configuration Render Blueprint (FREE PLAN)
# https://render.com/docs/blueprint-spec
#
# ⚠️ Plan Free Render :
#   - Pas de cron jobs (utilisez cron-job.org, voir docs/DEPLOYMENT.md)
#   - 750h/mois de runtime
#   - Spin down après 15 min d'inactivité (cold start ~30s)
#   - PostgreSQL free expire après 90 jours
#   - Pas de SSH (debug via logs + /api/health uniquement)
#
# Services créés :
#   - 1 web service (Docker, port 10000)
#   - 1 PostgreSQL (free tier, 1GB, expire après 90j)
# ============================================================

services:
  - type: web
    name: datasphere
    runtime: docker
    plan: free  # ⚠️ Free plan (pas de cron, spin down après 15min)
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ─── App ───
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"

      # ─── Database ───
      - key: DATABASE_URL
        fromDatabase:
          name: datasphere-db
          property: connectionString

      # ─── Auth ───
      # JWT_SECRET : secret pour signer les cookies de session (32+ chars)
      # CRON_SECRET : auto-dérivé de JWT_SECRET si non défini explicitement
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

      # ─── App URL (auto-détectée via RENDER_EXTERNAL_URL) ───
      # NEXT_PUBLIC_APP_URL : optionnel, le code utilise RENDER_EXTERNAL_URL en fallback
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # ─── AI Providers (au moins un requis pour la génération de posts) ───
      # Priorité : GEMINI > GLM > GROQ > OPENROUTER > z-ai-sdk (fallback)
      - key: GEMINI_API_KEY
        sync: false
      - key: GLM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      # ─── LinkedIn OAuth ───
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: LINKEDIN_WEBHOOK_SECRET
        sync: false

      # ─── Email (Resend) ───
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # ─── Notifications Telegram ───
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # ─── Notifications WhatsApp (CallMeBot) ───
      - key: WHATSAPP_CALLMEBOT_KEY
        sync: false
      - key: WHATSAPP_PHONE
        sync: false

      # ─── Stripe (optionnel) ───
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BUSINESS_MONTHLY
        sync: false

      # ─── Sentry (optionnel) ───
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

      # ─── Logs ───
      - key: LOG_LEVEL
        value: info

# ============================================================
# Base de données PostgreSQL managée
# ⚠️ Free tier : expire après 90 jours (voir docs/DEPLOYMENT.md)
# ============================================================
databases:
  - name: datasphere-db
    plan: free
    region: frankfurt
    ipAllowList: []

# ============================================================
# ❌ Pas de crons sur le plan free de Render
# Pour activer les tâches planifiées (sync analytics, scheduled publish,
# onboarding emails, payouts) :
#
# Option 1 : cron-job.org (gratuit, simple)
#   1. Créer un compte sur https://cron-job.org
#   2. Créer 4 jobs qui appellent :
#      - https://VOTRE-APP.onrender.com/api/cron/sync-analytics
#      - https://VOTRE-APP.onrender.com/api/cron/scheduled-publish
#      - https://VOTRE-APP.onrender.com/api/cron/onboarding-emails
#      - https://VOTRE-APP.onrender.com/api/cron/payouts
#   3. Headers : Authorization: Bearer ${CRON_SECRET}
#      (ou Bearer <JWT_SECRET dérivé> si CRON_SECRET non défini)
#   4. Schedule : voir docs/DEPLOYMENT.md
# ============================================================
